name: Aggiorna dati Indice PA

on:
  schedule:
    - cron: "17 3 * * 1"   # ogni lunedì alle 03:17 UTC
  workflow_dispatch:        # avvio manuale dal tab "Actions"

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scarica i dati IPA e rigenera data/enti.json
        run: python scripts/aggiorna_ipa.py
      - name: Prova il motore di verifica
        run: node tests/test_verifica.js
      - name: Salva se ci sono modifiche
        run: |
          git config user.name "ente-vero-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/enti.json data/enti.js
          git diff --cached --quiet || git commit -m "Aggiornamento dati IPA $(date +%F)"
          git push
